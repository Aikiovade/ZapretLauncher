name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  PYTHONUTF8: "1"

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint (ruff)
        run: |
          python -m pip install ruff
          python -m ruff check .
      - name: Run smoke tests
        run: python tools/smoke.py
      - name: Unit tests (pytest)
        run: |
          python -m pip install pytest
          python -m pytest -q
      - name: Type check (mypy, scoped)
        run: |
          python -m pip install mypy
          python -m mypy --ignore-missing-imports zapret_cli.py ed25519.py tools/ tests/
      - name: Security audit (pip-audit)
        continue-on-error: true
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r requirements.txt --format json --output pip-audit.json
          python -m pip_audit -r requirements.txt
      - name: SBOM (CycloneDX)
        continue-on-error: true
        run: |
          python -m pip install cyclonedx-bom
          python -m cyclonedx_py requirements requirements.txt -o sbom.json
      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-reports
          path: |
            pip-audit.json
            sbom.json
          if-no-files-found: ignore

  build:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller>=6.0"

      - name: Verify manifest version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: python
        run: |
          import json, os
          version = json.load(open("update_info.json", encoding="utf-8"))["version"]
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          assert version == tag, f"update_info.json version {version} != tag {tag}"

      - name: Build Zapret.exe (legacy Tk)
        run: python -m PyInstaller --noconfirm --clean Zapret.spec

      - name: Build ZapretWeb.exe (WebView2)
        run: python -m PyInstaller --noconfirm --clean ZapretWeb.spec

      - name: Build installer (Inno Setup, optional)
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DExeName=Zapret.exe installer\zapret_launcher.iss

      - name: Update manifest (hash + installer + signature)
        env:
          MANIFEST_SIGNING_KEY: ${{ secrets.MANIFEST_SIGNING_KEY }}
        run: |
          python tools/ci_update_manifest.py --exe dist/Zapret.exe --manifest update_info.json --repo "${{ github.repository }}" --tag "${{ github.ref_name }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZapretLauncher-exes
          path: |
            dist/Zapret.exe
            dist/ZapretWeb.exe
            update_info.json
          if-no-files-found: error

      - name: Commit manifest to main (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        shell: pwsh
        run: |
          git clone --depth 1 --filter=blob:none --sparse "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" manifest-repo
          Copy-Item update_info.json manifest-repo/update_info.json -Force
          git -C manifest-repo config user.name "github-actions[bot]"
          git -C manifest-repo config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C manifest-repo add update_info.json
          git -C manifest-repo diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git -C manifest-repo commit -m "Update update_info.json hash for ${{ github.ref_name }} (CI build)"
            git -C manifest-repo push origin HEAD:main
          } else {
            Write-Host "Manifest unchanged; nothing to commit."
          }

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Zapret.exe
            dist/ZapretWeb.exe
            dist/ZapretLauncher-*-setup.exe
            update_info.json
          fail_on_unmatched_files: false

  service-integration:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Service integration test (installs/removes zapret service)
        run: python tools/ci_service_integration.py
